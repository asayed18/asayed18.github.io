<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ahmed Sayed — Building AI Products</title>
  <meta name="description"
    content="Building AI products | ex-Amazon, ex-Huawei | 10+ yrs in scalable systems. TypeScript, Python, AWS, Berlin." />
  <meta name="author" content="Ahmed Sayed" />

    content="Ahmed Sayed, Senior Software Engineer, Full-Stack Developer, #TypeScript, #Python, #Rust, #AWS, #SystemDesign, #Golang, #React, #Node.js, Forgent AI, Link Datacenter, Seedstars, Huawei, Amazon, Babbel, Berlin, Portfolio, Resume, CV, Backend, Frontend, Cloud, APIs, Software Development" />

  <!-- Before the first paint: note that scripts run (the page is then the 3D journey, not the
       plain text version) and apply the visitor's theme, stored choice first. -->
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) { /* storage blocked */ }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      root.setAttribute('data-theme', theme);
    })();
  </script>

  <!-- Canonical URL -->
  <link rel="canonical" href="https://asayed18.top/" />

  <!-- Icons -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- The avatar is the largest element of the first screen -->
  <link rel="preload" as="image" href="/avatar-320.webp" type="image/webp" fetchpriority="high" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://asayed18.top/" />
  <meta property="og:title" content="Ahmed Sayed — Building AI Products" />

  <meta property="og:image:width" content="1264" />
  <meta property="og:image:height" content="848" />
  <meta property="og:image:alt" content="Portrait of Ahmed Sayed" />
  <meta property="og:site_name" content="Ahmed Sayed — Portfolio" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->

  <meta name="twitter:image" content="https://asayed18.top/avatar.png" />

  <!-- Theme color for mobile browsers -->

  <meta name="theme-color" content="#e0e0e0" media="(prefers-color-scheme: light)" />

  <!-- The structured data (JSON-LD) is generated at build time from src/data: see vite.config.ts. -->

  <!-- Google tag (gtag.js): on the live site only, not on localhost or previews -->
  <script>
    if (location.hostname.replace(/^www\./, '') === 'asayed18.top') {
      var gtagScript = document.createElement('script');
      gtagScript.async = true;
      gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-JJD6XSCTHM';
      document.head.appendChild(gtagScript);

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', 'G-JJD6XSCTHM');
    }
  </script>
</head>
